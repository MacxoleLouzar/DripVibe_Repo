apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aura_frontend
  template:
    metadata:
      labels:
        app: aura_frontend
    spec:
      containers:
      - name: aura-frontend
        image: aurafit-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aura-frontend-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: aura_frontend