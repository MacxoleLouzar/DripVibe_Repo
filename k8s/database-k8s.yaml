apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: posgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-db
  template:
    metadata:
      labels:
        app: aura-db
    spec:
      containers:
        - name: aura-db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "12345"
            - name: POSTGRES_DB
              value: "AurafitDB"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: posgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aura-db-service
spec:
  selector:
    app: aura-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432